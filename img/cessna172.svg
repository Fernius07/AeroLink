<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgSkyCessna" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgSkyCessna)" rx="12" />
  
  <!-- Nubes estilizadas -->
  <ellipse cx="90" cy="80" rx="40" ry="16" fill="#ffffff" opacity="0.7" />
  <ellipse cx="320" cy="100" rx="55" ry="18" fill="#ffffff" opacity="0.7" />

  <!-- Silueta Cessna 172 (Ala Alta) -->
  <g transform="translate(40, 70)">
    <!-- Ala Alta Superior -->
    <rect x="70" y="45" width="220" height="18" rx="4" fill="#0284c7" />
    <!-- Puntales de ala -->
    <line x1="120" y1="63" x2="150" y2="105" stroke="#0369a1" stroke-width="3" />
    <line x1="220" y1="63" x2="190" y2="105" stroke="#0369a1" stroke-width="3" />
    
    <!-- Fuselaje -->
    <path d="M 50 100 Q 140 85 270 95 L 310 80 L 310 115 L 260 115 Q 150 120 50 110 Z" fill="#ffffff" stroke="#0369a1" stroke-width="2" />
    <!-- Rayas decorativas -->
    <path d="M 90 100 L 260 105 L 255 110 L 80 106 Z" fill="#f77f00" />
    
    <!-- Cabina / Ventanillas -->
    <path d="M 120 90 L 160 90 L 175 102 L 115 102 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
    <path d="M 180 90 L 210 90 L 205 102 L 180 102 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
    
    <!-- Hélice y morro -->
    <ellipse cx="48" cy="104" rx="7" ry="9" fill="#0f172a" />
    <ellipse cx="48" cy="104" rx="3" ry="25" fill="#475569" opacity="0.8" />
    
    <!-- Tren de aterrizaje triciclo -->
    <line x1="80" y1="110" x2="75" y2="135" stroke="#334155" stroke-width="3" />
    <circle cx="73" cy="138" r="7" fill="#0f172a" />
    <line x1="170" y1="115" x2="160" y2="140" stroke="#334155" stroke-width="3" />
    <circle cx="158" cy="143" r="8" fill="#0f172a" />
    <line x1="190" y1="115" x2="200" y2="140" stroke="#334155" stroke-width="3" />
    <circle cx="202" cy="143" r="8" fill="#0f172a" />
    
    <!-- Empenaje vertical de cola -->
    <polygon points="270,95 295,50 315,50 305,95" fill="#0284c7" />
  </g>

  <!-- Etiquetas técnicas -->
  <rect x="20" y="245" width="145" height="34" rx="8" fill="#0284c7" />
  <text x="92" y="267" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Cessna 172S • EC-MRX</text>
  
  <rect x="235" y="245" width="145" height="34" rx="8" fill="#0369a1" />
  <text x="307" y="267" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Aviónica Garmin G1000</text>
</svg>
