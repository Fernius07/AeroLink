<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Fondo estilo plano técnico blueprint / CAD -->
  <rect width="800" height="500" fill="#ffffff" />
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#0d47a1" stroke-width="2" />
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#90caf9" stroke-width="1" />
  
  <!-- Cuadro de rotulación oficial (Title Block) -->
  <g transform="translate(480, 410)">
    <rect width="300" height="70" fill="#f5f5f5" stroke="#0d47a1" stroke-width="1.5" />
    <line x1="0" y1="24" x2="300" y2="24" stroke="#0d47a1" stroke-width="1" />
    <text x="10" y="17" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#0d47a1">DIAMOND DA40 NG - 3-VIEW SCHEMATIC</text>
    <text x="10" y="42" font-family="sans-serif" font-size="10" fill="#333">Fabricante: Diamond Aircraft Ind. (Austria)</text>
    <text x="10" y="58" font-family="sans-serif" font-size="10" fill="#333">Escala: Proporcional POH Oficial • Matrícula: EC-TGO</text>
  </g>

  <!-- 1. VISTA EN PLANTA (Top View) -->
  <g transform="translate(60, 40)">
    <!-- Alas alargadas con winglets -->
    <path d="M 40 115 L 340 115 L 348 100 L 350 125 L 340 128 L 40 128 Z" fill="#e3f2fd" stroke="#0d47a1" stroke-width="1.8" />
    <path d="M 40 115 L -260 115 L -268 100 L -270 125 L -260 128 L 40 128 Z" fill="#e3f2fd" stroke="#0d47a1" stroke-width="1.8" />
    <!-- Fuselaje -->
    <ellipse cx="40" cy="120" rx="20" ry="110" fill="#ffffff" stroke="#0d47a1" stroke-width="2" />
    <!-- Hélice -->
    <ellipse cx="40" cy="8" rx="22" ry="4" fill="#666" />
    <!-- Cabina acristalada -->
    <ellipse cx="40" cy="85" rx="14" ry="32" fill="#bbdefb" stroke="#1976d2" stroke-width="1.5" />
    <!-- Estabilizador horizontal de cola en T -->
    <rect x="-25" y="215" width="130" height="18" rx="2" fill="#e3f2fd" stroke="#0d47a1" stroke-width="1.5" />
    
    <!-- Cota Envergadura: 11.63 m -->
    <line x1="-270" y1="145" x2="350" y2="145" stroke="#e65100" stroke-width="1.5" stroke-dasharray="4 2" />
    <polygon points="-270,145 -260,142 -260,148" fill="#e65100" />
    <polygon points="350,145 340,142 340,148" fill="#e65100" />
    <text x="40" y="160" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#e65100" text-anchor="middle">ENVERGADURA: 11,63 m</text>
  </g>

  <!-- 2. VISTA LATERAL (Side Profile) -->
  <g transform="translate(440, 60)">
    <!-- Perfil de fuselaje estilizado con morro a la izquierda -->
    <path d="M 20 85 Q 90 60 190 70 L 290 62 L 305 18 L 320 18 L 315 75 Q 180 95 20 90 Z" fill="#ffffff" stroke="#0d47a1" stroke-width="2" />
    <!-- Cúpula de cabina de burbuja -->
    <path d="M 70 65 Q 110 40 150 72 Z" fill="#bbdefb" stroke="#1976d2" stroke-width="1.5" />
    <!-- Hélice paso variable -->
    <line x1="16" y1="65" x2="16" y2="105" stroke="#666" stroke-width="3" />
    <!-- Estabilizador en T en cola -->
    <polygon points="295,18 330,18 325,23 290,23" fill="#0d47a1" />
    <!-- Tren de aterrizaje triciclo -->
    <line x1="65" y1="90" x2="60" y2="115" stroke="#333" stroke-width="2" />
    <circle cx="58" cy="118" r="7" fill="#222" />
    <line x1="135" y1="85" x2="130" y2="116" stroke="#333" stroke-width="2" />
    <circle cx="128" cy="119" r="8" fill="#222" />

    <!-- Cota Longitud: 8.15 m -->
    <line x1="16" y1="140" x2="325" y2="140" stroke="#e65100" stroke-width="1.5" stroke-dasharray="4 2" />
    <polygon points="16,140 26,137 26,143" fill="#e65100" />
    <polygon points="325,140 315,137 315,143" fill="#e65100" />
    <text x="170" y="155" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#e65100" text-anchor="middle">LONGITUD: 8,15 m</text>
  </g>

  <!-- 3. VISTA FRONTAL (Front View) -->
  <g transform="translate(60, 310)">
    <!-- Alas y diedro -->
    <path d="M 40 50 L 330 35 L 340 20 L 338 42 L 40 58 L -258 42 L -260 20 L -250 35 Z" fill="#e3f2fd" stroke="#0d47a1" stroke-width="1.8" />
    <!-- Fuselaje redondo frontal -->
    <ellipse cx="40" cy="45" rx="22" ry="24" fill="#ffffff" stroke="#0d47a1" stroke-width="2" />
    <!-- Hélice frontal -->
    <circle cx="40" cy="45" r="4" fill="#e65100" />
    <ellipse cx="40" cy="45" rx="35" ry="35" fill="none" stroke="#999" stroke-dasharray="3 3" />
    <!-- Cabina -->
    <ellipse cx="40" cy="38" rx="15" ry="14" fill="#bbdefb" stroke="#1976d2" stroke-width="1.5" />
    <!-- Cola en T arriba -->
    <line x1="40" y1="21" x2="40" y2="-15" stroke="#0d47a1" stroke-width="3" />
    <rect x="-10" y="-20" width="100" height="6" fill="#0d47a1" />
    <!-- Tren de aterrizaje frontal -->
    <line x1="28" y1="62" x2="22" y2="85" stroke="#333" stroke-width="2" />
    <circle cx="20" cy="88" r="6" fill="#222" />
    <line x1="52" y1="62" x2="58" y2="85" stroke="#333" stroke-width="2" />
    <circle cx="60" cy="88" r="6" fill="#222" />
    <line x1="40" y1="68" x2="40" y2="88" stroke="#333" stroke-width="2" />
    <circle cx="40" cy="91" r="5" fill="#222" />

    <!-- Cota Altura: 1.98 m -->
    <line x1="365" y1="-20" x2="365" y2="92" stroke="#e65100" stroke-width="1.5" stroke-dasharray="4 2" />
    <polygon points="365,-20 362,-10 368,-10" fill="#e65100" />
    <polygon points="365,92 362,82 368,82" fill="#e65100" />
    <text x="400" y="40" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#e65100">ALTURA: 1,98 m</text>
  </g>
</svg>
