<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgSkyPiper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgSkyPiper)" rx="12" />
  
  <ellipse cx="110" cy="70" rx="45" ry="15" fill="#ffffff" opacity="0.8" />
  <ellipse cx="300" cy="90" rx="50" ry="16" fill="#ffffff" opacity="0.8" />

  <!-- Silueta Piper PA-28 Archer (Ala Baja) -->
  <g transform="translate(40, 75)">
    <!-- Fuselaje aerodinámico -->
    <path d="M 45 95 Q 130 75 270 95 L 305 85 L 305 110 L 260 110 Q 150 115 45 105 Z" fill="#ffffff" stroke="#15803d" stroke-width="2" />
    <path d="M 85 96 L 255 100 L 250 106 L 75 102 Z" fill="#16a34a" />
    
    <!-- Cúpula de cabina de una sola pieza -->
    <path d="M 125 78 Q 165 72 205 92 L 130 92 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
    
    <!-- Ala Baja extendida -->
    <polygon points="120,105 220,105 250,125 150,125" fill="#15803d" />
    
    <!-- Cola Piper en cruz -->
    <polygon points="270,95 290,45 305,45 298,95" fill="#16a34a" />
    <line x1="280" y1="90" x2="315" y2="90" stroke="#15803d" stroke-width="4" />
    
    <!-- Hélice -->
    <ellipse cx="43" cy="100" rx="6" ry="8" fill="#0f172a" />
    <ellipse cx="43" cy="100" rx="3" ry="24" fill="#475569" opacity="0.8" />

    <!-- Tren triciclo carenado -->
    <polygon points="70,108 65,130 80,130" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
    <circle cx="73" cy="133" r="6" fill="#0f172a" />
    <polygon points="180,118 175,140 190,140" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
    <circle cx="183" cy="143" r="7" fill="#0f172a" />
  </g>

  <!-- Etiquetas técnicas -->
  <rect x="20" y="245" width="145" height="34" rx="8" fill="#15803d" />
  <text x="92" y="267" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Piper PA-28 • EC-KLM</text>
  
  <rect x="235" y="245" width="145" height="34" rx="8" fill="#16a34a" />
  <text x="307" y="267" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Crucero 125 Kts • 4 Plazas</text>
</svg>
