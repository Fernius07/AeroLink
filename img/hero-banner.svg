<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
  <defs>
    <linearGradient id="skyGradAero" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="runwayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  
  <!-- Cielo -->
  <rect width="1000" height="450" fill="url(#skyGradAero)" />
  
  <!-- Nubes en capas -->
  <ellipse cx="200" cy="120" rx="90" ry="25" fill="#ffffff" opacity="0.6" />
  <ellipse cx="260" cy="110" rx="70" ry="30" fill="#ffffff" opacity="0.8" />
  <ellipse cx="750" cy="90" rx="110" ry="28" fill="#ffffff" opacity="0.7" />
  <ellipse cx="820" cy="80" rx="80" ry="32" fill="#ffffff" opacity="0.85" />
  
  <!-- Terreno y horizonte del aeródromo -->
  <rect x="0" y="270" width="1000" height="180" fill="#64748b" opacity="0.4" />
  
  <!-- Pista de aterrizaje en perspectiva -->
  <polygon points="380,270 620,270 850,450 150,450" fill="url(#runwayGrad)" />
  <!-- Líneas centrales de pista (discontinuas blancas) -->
  <polygon points="496,275 504,275 506,310 494,310" fill="#ffffff" />
  <polygon points="494,325 506,325 509,370 491,370" fill="#ffffff" />
  <polygon points="490,390 510,390 514,445 486,445" fill="#ffffff" />
  
  <!-- Cabecera de pista / Umbral (Runway Threshold) -->
  <rect x="390" y="272" width="220" height="4" fill="#ffffff" />
  <!-- Número de pista -->
  <text x="500" y="440" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">24L</text>

  <!-- Torre de control al fondo -->
  <g transform="translate(80, 160)">
    <rect x="35" y="50" width="20" height="60" fill="#e2e8f0" stroke="#0f172a" stroke-width="2" />
    <polygon points="25,50 65,50 60,30 30,30" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
    <polygon points="20,30 70,30 45,15" fill="#ef4444" />
    <!-- Antenas / Radar -->
    <line x1="45" y1="15" x2="45" y2="2" stroke="#0f172a" stroke-width="2" />
    <circle cx="45" cy="2" r="3" fill="#f77f00" />
  </g>

  <!-- Hangar del club -->
  <g transform="translate(180, 200)">
    <path d="M 0 70 L 0 30 Q 60 10 120 30 L 120 70 Z" fill="#cbd5e1" stroke="#334155" stroke-width="2" />
    <rect x="20" y="35" width="80" height="35" fill="#1e293b" />
    <text x="60" y="26" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">HANGAR AEROLINK</text>
  </g>

  <!-- Avión en ascenso en primer plano -->
  <g transform="translate(560, 140) rotate(-12)">
    <!-- Alas -->
    <polygon points="40,65 140,55 180,75 20,80" fill="#0284c7" />
    <!-- Fuselaje -->
    <path d="M 10 70 Q 100 50 200 65 L 225 50 L 225 75 L 180 75 Q 90 85 10 75 Z" fill="#ffffff" stroke="#0369a1" stroke-width="2" />
    <path d="M 40 70 L 180 72 L 175 76 L 30 74 Z" fill="#f77f00" />
    <!-- Cabina -->
    <polygon points="70,60 110,55 125,68 65,68" fill="#38bdf8" />
    <!-- Hélice girando -->
    <ellipse cx="8" cy="72" rx="3" ry="24" fill="#64748b" opacity="0.6" />
    <!-- Cola -->
    <polygon points="190,65 210,30 225,30 220,65" fill="#0284c7" />
  </g>

  <!-- Cartel institucional -->
  <rect x="50" y="30" width="480" height="95" rx="10" fill="#ffffff" opacity="0.9" />
  <text x="70" y="70" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#03045e">Libertad y precisión en cada vuelo</text>
  <text x="70" y="100" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#0284c7">Flota de aeronaves certificadas • Escuela de Pilotos ATO-248</text>
</svg>
