<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8f3dc" />
      <stop offset="100%" stop-color="#b7e4c7" />
    </linearGradient>
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#74c69d" />
      <stop offset="100%" stop-color="#40916c" />
    </linearGradient>
  </defs>
  <rect width="1000" height="450" fill="url(#skyGrad)" />
  
  <!-- Colinas de fondo -->
  <path d="M 0 350 Q 250 240 550 320 T 1000 290 L 1000 450 L 0 450 Z" fill="#95d5b2" opacity="0.7" />
  <path d="M 0 380 Q 300 300 700 360 T 1000 340 L 1000 450 L 0 450 Z" fill="url(#hillGrad)" />
  
  <!-- Árboles decorativos -->
  <circle cx="120" cy="280" r="45" fill="#2d6a4f" />
  <rect x="115" y="320" width="10" height="40" fill="#5c4033" />
  <circle cx="160" cy="295" r="35" fill="#40916c" />
  <rect x="156" y="325" width="8" height="35" fill="#5c4033" />
  
  <circle cx="850" cy="270" r="50" fill="#2d6a4f" />
  <rect x="845" y="315" width="10" height="45" fill="#5c4033" />
  <circle cx="910" cy="290" r="40" fill="#52b788" />
  <rect x="906" y="325" width="8" height="35" fill="#5c4033" />

  <!-- Caseta del refugio -->
  <g transform="translate(420, 220)">
    <!-- Base -->
    <rect x="20" y="60" width="120" height="85" fill="#ffffff" stroke="#2d6a4f" stroke-width="3" rx="4" />
    <!-- Tejado -->
    <polygon points="10,60 80,10 150,60" fill="#b02a37" />
    <!-- Puerta -->
    <path d="M 60 145 L 60 100 A 20 20 0 0 1 100 100 L 100 145 Z" fill="#2d6a4f" />
    <circle cx="80" cy="40" r="12" fill="#ffffff" />
    <!-- Huella en el frontón -->
    <circle cx="80" cy="43" r="5" fill="#b02a37" />
    <circle cx="75" cy="35" r="2.2" fill="#b02a37" />
    <circle cx="80" cy="33" r="2.2" fill="#b02a37" />
    <circle cx="85" cy="35" r="2.2" fill="#b02a37" />
  </g>
  
  <!-- Animales en el prado -->
  <!-- Silueta perro jugando -->
  <g transform="translate(600, 310)">
    <ellipse cx="40" cy="30" rx="25" ry="16" fill="#1b4332" />
    <circle cx="62" cy="18" r="12" fill="#1b4332" />
    <polygon points="60,10 65,2 70,12" fill="#1b4332" />
    <line x1="25" y1="40" x2="20" y2="60" stroke="#1b4332" stroke-width="5" stroke-linecap="round" />
    <line x1="35" y1="42" x2="35" y2="60" stroke="#1b4332" stroke-width="5" stroke-linecap="round" />
    <line x1="50" y1="42" x2="55" y2="58" stroke="#1b4332" stroke-width="5" stroke-linecap="round" />
    <path d="M 18 25 Q 5 15 10 5" stroke="#1b4332" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>
  <!-- Pelota -->
  <circle cx="690" cy="365" r="9" fill="#e76f51" />
  
  <!-- Mensaje decorativo en el cielo -->
  <rect x="50" y="40" width="480" height="95" rx="10" fill="#ffffff" opacity="0.9" />
  <text x="70" y="80" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#1b4332">Por un hogar para cada huella</text>
  <text x="70" y="112" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="500" fill="#2d6a4f">Centro de rescate, recuperación y adopción ética</text>
</svg>
