<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#ffffff" />
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#0d47a1" stroke-width="2" />
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#90caf9" stroke-width="1" />

  <!-- Cuadro de rotulación oficial (Title Block) -->
  <g transform="translate(480, 410)">
    <rect width="300" height="70" fill="#f5f5f5" stroke="#0d47a1" stroke-width="1.5" />
    <line x1="0" y1="24" x2="300" y2="24" stroke="#0d47a1" stroke-width="1" />
    <text x="10" y="17" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#0d47a1">TECNAM P2002 SIERRA - 3-VIEW SCHEMATIC</text>
    <text x="10" y="42" font-family="sans-serif" font-size="10" fill="#333">Fabricante: Costruzioni Aeronautiche Tecnam (Italia)</text>
    <text x="10" y="58" font-family="sans-serif" font-size="10" fill="#333">Escala: Proporcional POH Oficial • Matrícula: EC-JPR</text>
  </g>

  <!-- 1. VISTA EN PLANTA (Top View) -->
  <g transform="translate(60, 40)">
    <!-- Alas de ala baja cónicas -->
    <path d="M 40 100 L 290 105 L 285 130 L 40 135 L -205 135 L -210 105 Z" fill="#e3f2fd" stroke="#0d47a1" stroke-width="1.8" />
    <!-- Fuselaje compacto -->
    <ellipse cx="40" cy="115" rx="22" ry="95" fill="#ffffff" stroke="#0d47a1" stroke-width="2" />
    <!-- Hélice bipala Rotax -->
    <ellipse cx="40" cy="20" rx="25" ry="4" fill="#666" />
    <!-- Cúpula de cabina biplaza -->
    <ellipse cx="40" cy="90" rx="16" ry="25" fill="#bbdefb" stroke="#1976d2" stroke-width="1.5" />
    <!-- Estabilizador horizontal de cola -->
    <rect x="-15" y="195" width="110" height="15" rx="2" fill="#e3f2fd" stroke="#0d47a1" stroke-width="1.5" />

    <!-- Cota Envergadura: 8.60 m -->
    <line x1="-210" y1="155" x2="290" y2="155" stroke="#e65100" stroke-width="1.5" stroke-dasharray="4 2" />
    <polygon points="-210,155 -200,152 -200,158" fill="#e65100" />
    <polygon points="290,155 280,152 280,158" fill="#e65100" />
    <text x="40" y="170" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#e65100" text-anchor="middle">ENVERGADURA: 8,60 m</text>
  </g>

  <!-- 2. VISTA LATERAL (Side Profile) -->
  <g transform="translate(440, 60)">
    <!-- Perfil fuselaje Tecnam con morro bajo -->
    <path d="M 20 85 Q 80 65 170 75 L 260 72 L 275 30 L 290 30 L 285 85 Q 160 100 20 90 Z" fill="#ffffff" stroke="#0d47a1" stroke-width="2" />
    <!-- Cúpula de cabina panorámica corrediza -->
    <path d="M 65 72 Q 100 48 135 77 Z" fill="#bbdefb" stroke="#1976d2" stroke-width="1.5" />
    <!-- Hélice Rotax -->
    <line x1="16" y1="65" x2="16" y2="105" stroke="#666" stroke-width="3" />
    <!-- Estabilizador de cola tradicional -->
    <polygon points="255,72 275,30 290,30 282,75" fill="#0d47a1" />
    <line x1="250" y1="75" x2="295" y2="75" stroke="#0d47a1" stroke-width="3" />
    <!-- Tren de aterrizaje triciclo amortiguado -->
    <line x1="55" y1="90" x2="50" y2="115" stroke="#333" stroke-width="2" />
    <circle cx="48" cy="118" r="6" fill="#222" />
    <line x1="120" y1="88" x2="115" y2="116" stroke="#333" stroke-width="2" />
    <circle cx="113" cy="119" r="7" fill="#222" />

    <!-- Cota Longitud: 6.61 m -->
    <line x1="16" y1="140" x2="295" y2="140" stroke="#e65100" stroke-width="1.5" stroke-dasharray="4 2" />
    <polygon points="16,140 26,137 26,143" fill="#e65100" />
    <polygon points="295,140 285,137 285,143" fill="#e65100" />
    <text x="155" y="155" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#e65100" text-anchor="middle">LONGITUD: 6,61 m</text>
  </g>

  <!-- 3. VISTA FRONTAL (Front View) -->
  <g transform="translate(60, 310)">
    <!-- Alas frontales con diedro positivo -->
    <path d="M 40 52 L 275 42 L 275 48 L 40 58 L -195 48 L -195 42 Z" fill="#e3f2fd" stroke="#0d47a1" stroke-width="1.8" />
    <!-- Fuselaje frontal -->
    <ellipse cx="40" cy="50" rx="20" ry="22" fill="#ffffff" stroke="#0d47a1" stroke-width="2" />
    <!-- Disco hélice -->
    <circle cx="40" cy="50" r="4" fill="#e65100" />
    <ellipse cx="40" cy="50" rx="30" ry="30" fill="none" stroke="#999" stroke-dasharray="3 3" />
    <!-- Cúpula de cabina vista frontal -->
    <ellipse cx="40" cy="42" rx="14" ry="12" fill="#bbdefb" stroke="#1976d2" stroke-width="1.5" />
    <!-- Cola tradicional -->
    <line x1="40" y1="28" x2="40" y2="0" stroke="#0d47a1" stroke-width="2.5" />
    <line x1="0" y1="22" x2="80" y2="22" stroke="#0d47a1" stroke-width="2.5" />
    <!-- Tren de aterrizaje frontal -->
    <line x1="28" y1="68" x2="22" y2="88" stroke="#333" stroke-width="2" />
    <circle cx="20" cy="90" r="5" fill="#222" />
    <line x1="52" y1="68" x2="58" y2="88" stroke="#333" stroke-width="2" />
    <circle cx="60" cy="90" r="5" fill="#222" />
    <line x1="40" y1="72" x2="40" y2="90" stroke="#333" stroke-width="2" />
    <circle cx="40" cy="92" r="5" fill="#222" />

    <!-- Cota Altura: 2.43 m -->
    <line x1="310" y1="0" x2="310" y2="92" stroke="#e65100" stroke-width="1.5" stroke-dasharray="4 2" />
    <polygon points="310,0 307,10 313,10" fill="#e65100" />
    <polygon points="310,92 307,82 313,82" fill="#e65100" />
    <text x="340" y="45" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#e65100">ALTURA: 2,43 m</text>
  </g>
</svg>
