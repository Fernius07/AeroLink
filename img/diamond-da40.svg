<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgSkyDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgSkyDiamond)" rx="12" />
  
  <ellipse cx="100" cy="80" rx="40" ry="14" fill="#ffffff" opacity="0.8" />
  <ellipse cx="320" cy="95" rx="48" ry="15" fill="#ffffff" opacity="0.8" />

  <!-- Silueta Diamond DA40 (Cola en T y Winglets) -->
  <g transform="translate(35, 75)">
    <!-- Fuselaje de fibra de carbono ultra aerodinámico -->
    <path d="M 45 92 Q 135 70 275 88 L 305 78 L 305 98 L 265 100 Q 150 108 45 98 Z" fill="#ffffff" stroke="#c2410c" stroke-width="2" />
    <path d="M 85 92 L 265 94 L 260 98 L 75 96 Z" fill="#ea580c" />
    
    <!-- Cúpula de burbuja panorámica -->
    <path d="M 120 72 Q 165 65 205 88 L 125 88 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
    
    <!-- Alas alargadas con winglets -->
    <polygon points="120,98 220,98 250,118 150,118" fill="#c2410c" />
    
    <!-- Cola en T característica de Diamond -->
    <polygon points="280,88 292,35 304,35 296,88" fill="#ea580c" />
    <!-- Estabilizador horizontal arriba de la cola (en T) -->
    <rect x="270" y="32" width="50" height="7" rx="2" fill="#9a3412" />
    
    <!-- Hélice paso variable -->
    <ellipse cx="43" cy="94" rx="6" ry="8" fill="#0f172a" />
    <ellipse cx="43" cy="94" rx="3" ry="24" fill="#475569" opacity="0.8" />

    <!-- Tren retráctil/carenado moderno -->
    <circle cx="73" cy="125" r="6" fill="#0f172a" />
    <circle cx="180" cy="132" r="7" fill="#0f172a" />
  </g>

  <!-- Etiquetas técnicas -->
  <rect x="20" y="245" width="145" height="34" rx="8" fill="#c2410c" />
  <text x="92" y="267" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Diamond DA40 • EC-TGO</text>
  
  <rect x="235" y="245" width="145" height="34" rx="8" fill="#ea580c" />
  <text x="307" y="267" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Motor Austro Jet-A1 • IFR</text>
</svg>
