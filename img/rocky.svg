<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgRocky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3f2fd" />
      <stop offset="100%" stop-color="#bbdefb" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgRocky)" rx="12" />
  <circle cx="200" cy="150" r="95" fill="#ffffff" opacity="0.6" />
  <!-- Perro Rocky -->
  <g transform="translate(145, 75)">
    <!-- Orejas rectas estilo pastor -->
    <polygon points="20,65 10,15 45,45" fill="#424242" />
    <polygon points="23,55 18,25 40,45" fill="#ffab91" />
    <polygon points="90,65 100,15 65,45" fill="#424242" />
    <polygon points="87,55 92,25 70,45" fill="#ffab91" />
    <!-- Cabeza -->
    <ellipse cx="55" cy="70" rx="45" ry="40" fill="#616161" />
    <!-- Máscara negra -->
    <ellipse cx="55" cy="80" rx="28" ry="24" fill="#212121" />
    <!-- Ojos miel -->
    <circle cx="40" cy="65" r="6" fill="#bf360c" />
    <circle cx="42" cy="63" r="2" fill="#ffffff" />
    <circle cx="70" cy="65" r="6" fill="#bf360c" />
    <circle cx="72" cy="63" r="2" fill="#ffffff" />
    <!-- Trufa -->
    <ellipse cx="55" cy="78" rx="8" ry="6" fill="#000000" />
    <!-- Lengua feliz -->
    <path d="M 52 86 C 52 98 58 98 58 86 Z" fill="#ef5350" />
  </g>
  <rect x="20" y="245" width="130" height="34" rx="8" fill="#1565c0" />
  <text x="85" y="267" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Rocky • 3 años</text>
  <rect x="250" y="245" width="130" height="34" rx="8" fill="#1976d2" />
  <text x="315" y="267" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Guardián &amp; Fiel</text>
</svg>
