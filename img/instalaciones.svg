<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <rect width="600" height="350" fill="#edf2f4" rx="8" />
  <!-- Instalaciones de veterinaria y patio -->
  <rect x="30" y="50" width="250" height="240" fill="#ffffff" stroke="#2b2d42" stroke-width="2" rx="6" />
  <rect x="50" y="70" width="80" height="70" fill="#8d99ae" opacity="0.3" stroke="#2b2d42" />
  <rect x="160" y="70" width="80" height="70" fill="#8d99ae" opacity="0.3" stroke="#2b2d42" />
  <rect x="105" y="190" width="60" height="100" fill="#2d6a4f" />
  <circle cx="155" cy="240" r="4" fill="#ffd166" />
  <!-- Cruz médica verde -->
  <rect x="125" y="20" width="20" height="40" fill="#2d6a4f" rx="3" />
  <rect x="115" y="30" width="40" height="20" fill="#2d6a4f" rx="3" />
  
  <text x="155" y="320" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#2b2d42" text-anchor="middle">Área Clínica &amp; Cuarentena</text>
  
  <!-- Zona de esparcimiento / pipican -->
  <rect x="320" y="50" width="250" height="240" fill="#d8f3dc" stroke="#40916c" stroke-width="2" stroke-dasharray="8 4" rx="6" />
  <!-- Circuito agility -->
  <polygon points="350,220 380,150 410,220" fill="none" stroke="#e76f51" stroke-width="6" />
  <rect x="440" y="180" width="100" height="15" fill="#f4a261" rx="4" />
  <circle cx="450" cy="210" r="15" fill="none" stroke="#264653" stroke-width="5" />
  
  <text x="445" y="320" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#2b2d42" text-anchor="middle">Zona Agility y Socialización</text>
</svg>
